server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # index.html e env-config.js nunca cacheados: garante que um novo deploy
    # (ou uma troca de variavel de ambiente) valha imediatamente.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    location = /env-config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # SPA: todas as rotas caem no index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Modulos ES (.mjs): o worker do pdf.js e servido assim. O mime.types do
    # nginx nao conhece a extensao e a entrega como application/octet-stream,
    # e o navegador se recusa a executar modulo com MIME errado
    # ("Failed to fetch dynamically imported module").
    location ~* \.mjs$ {
        types { application/javascript mjs; }
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Assets com hash no nome (gerados pelo Vite) podem ser cacheados pra sempre
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
}
